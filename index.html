<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Tutor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 Topic Tutor</h1>
      <p>Learn any topic with your AI study buddy.</p>
    </header>

    <main>

      <div class="card">
        <label>What do you want to learn?</label>

        <input
          id="topic"
          type="text"
          placeholder="Example: Photosynthesis"
        >

        <label>Choose your class</label>

        <select id="classLevel">
          <option>Class 6</option>
          <option>Class 7</option>
          <option>Class 8</option>
          <option>Class 9</option>
          <option>Class 10</option>
        </select>

        <button onclick="generateStudyPack()">
          🚀 Generate Study Pack
        </button>
      </div>

      <div id="result"></div>

    </main>

    <footer>
      <p>© 2026 Topic Tutor • Free for students</p>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
